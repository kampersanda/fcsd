[package]
name = "fcsd-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fcsd =  { path = ".." }
fst = "0.4"
yada = "0.7"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bin]]
name = "memory"
path = "src/memory.rs"

[[bench]]
name = "timing"
harness = false
